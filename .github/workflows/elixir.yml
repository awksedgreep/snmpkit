name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '28.0'
          - elixir: '1.20.0'
            otp: '28.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    # Elixir 1.20's type checker reports ~30 pre-existing redundant/unreachable
    # clauses that are 2.0 clean-up work; enforce zero warnings on the 1.18
    # baseline and only compile on newer releases.
    - name: Compile (warnings are errors)
      if: matrix.elixir == '1.18.4'
      run: mix compile --warnings-as-errors
    - name: Compile
      if: matrix.elixir != '1.18.4'
      run: mix compile
    - name: Run tests
      run: mix test
