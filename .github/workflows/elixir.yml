name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '28.0'
          - elixir: '1.20.0'
            otp: '28.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Check for debug IO calls
      # Enforces AGENTS.md: no IO.puts/IO.inspect in code (use Logger).
      # AST-based, so IO calls inside @doc examples are ignored.
      run: |
        elixir -e '
        hits =
          Path.wildcard("{lib,test}/**/*.ex*")
          |> Enum.flat_map(fn file ->
            quoted = file |> File.read!() |> Code.string_to_quoted!(file: file)
            {_ast, acc} =
              Macro.prewalk(quoted, [], fn
                {{:., _, [{:__aliases__, _, [:IO]}, op]}, _, _} = node, acc
                when op in [:puts, :inspect] ->
                  {node, [op | acc]}
                node, acc ->
                  {node, acc}
              end)
            Enum.map(acc, &{file, &1})
          end)
        if hits == [] do
          IO.puts("No debug IO calls in lib/ or test/")
        else
          Enum.each(hits, fn {file, op} -> IO.puts("#{file}: IO.#{op} call") end)
          System.halt(1)
        end'
    - name: Run tests
      run: mix test
